version: "3.8"

services:
  app:
    build: .
    container_name: water-assistant
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      - WCA_DEBUG=false
    volumes:
      - ./data:/app/data
      - ./config:/app/config
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # 可选：Redis（分布式会话支持）
  redis:
    image: redis:7-alpine
    container_name: water-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped
    profiles:
      - with-redis

volumes:
  redis-data:
